<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Escape Trailer — Quality Gates</title>
<style>
:root{--navy:#1a1a2e;--blue:#0d47a1;--green:#2e7d32;--red:#c62828;--orange:#e65100;--purple:#6a1b9a;--gray:#546e7a;--bg:#f5f6fa;--card:#fff;--shadow:0 2px 12px rgba(0,0,0,.08);--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#333;-webkit-tap-highlight-color:transparent}
.topbar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:17px;font-weight:700}.topbar h1 span{opacity:.6;font-weight:400;font-size:13px}
.topbar-actions{display:flex;gap:6px}
.topbar-actions button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.view{display:none;padding:14px;max-width:960px;margin:0 auto}.view.active{display:block}
.btn{display:inline-block;padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--blue);color:#fff}.btn-danger{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}.btn-orange{background:var(--orange);color:#fff}
.btn-gray{background:#78909c;color:#fff}.btn-navy{background:var(--navy);color:#fff}
.btn-sm{padding:7px 12px;font-size:12px}.btn-block{display:block;width:100%;text-align:center}

/* TRAILER CARDS */
.trailer-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:5px solid transparent}
.trailer-card:active{transform:scale(.98)}.trailer-card.complete{border-left-color:var(--green)}
.trailer-card.has-issues{border-left-color:var(--red)}.trailer-card.in-progress{border-left-color:var(--blue)}
.trailer-card .info h3{font-size:15px;color:var(--navy)}.trailer-card .info p{font-size:12px;color:#888;margin-top:2px}
.trailer-card .pct{font-size:22px;font-weight:700}
.progress-bar{width:100px;height:5px;background:#e0e0e0;border-radius:3px;margin-top:3px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px}

/* FORM */
.form-card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.form-card h2{font-size:17px;margin-bottom:14px;color:var(--navy)}
.fg{margin-bottom:12px}.fg label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue)}

/* MAIN TABS (inside trailer) */
.main-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch;border-bottom:2px solid #e0e0e0;margin-bottom:10px}
.main-tab{flex-shrink:0;padding:8px 14px;border-radius:8px 8px 0 0;background:#e8eaf6;color:var(--navy);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.main-tab.active{background:var(--navy);color:#fff}

/* GATE TABS */
.gate-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.gate-tab{flex-shrink:0;padding:8px 14px;border-radius:18px;background:#e8eaf6;color:var(--navy);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;position:relative}
.gate-tab.active{background:var(--navy);color:#fff}
.gate-tab .badge{position:absolute;top:-3px;right:-3px;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}

/* INSPECTOR + TIME */
.bar{border-radius:8px;padding:8px 12px;margin:6px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.bar-insp{background:#e3f2fd}.bar-time{background:#f3e5f5}
.bar label{font-weight:600;white-space:nowrap}
.bar select{flex:1;min-width:130px;padding:7px;border:2px solid #90caf9;border-radius:6px;font-size:13px}
.bar .tv{font-family:monospace;font-size:13px}

/* SECTIONS & ITEMS */
.sec-hdr{background:#e8eaf6;padding:9px 12px;border-radius:8px;margin:10px 0 5px;font-weight:700;font-size:13px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.sec-hdr .cnt{font-weight:400;font-size:11px;color:#666}
.sec-hdr .photo-btn{background:var(--blue);color:#fff;border:none;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}

.ci{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:5px;box-shadow:0 1px 3px rgba(0,0,0,.04);border-left:4px solid transparent}
.ci .ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ci .cn{font-weight:700;color:var(--blue);font-size:12px;min-width:36px}
.ci .cd{flex:1;font-size:12px;line-height:1.35}
.ci .ca{display:flex;gap:5px;flex-shrink:0}
.ci .ca button{width:40px;height:40px;border-radius:7px;border:2px solid #e0e0e0;background:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ci .ca button:active{transform:scale(.9)}
.ci .ca button.sp{background:#e8f5e9;border-color:var(--green)}
.ci .ca button.sr{background:#fff3e0;border-color:var(--orange)}
.ci .ca button.sf{background:#ffebee;border-color:var(--red)}
.ci.st-pass{border-left-color:var(--green)}.ci.st-rework{border-left-color:var(--orange);background:#fffde7}
.ci.st-fail{border-left-color:var(--red);background:#fff5f5}
.ci.st-recheck-pass{border-left-color:var(--green);background:#e8f5e9}
.ci.st-recheck-fail{border-left-color:var(--red);background:#fce4ec}
.ci .cm{margin-top:3px;font-size:10px;color:#999}
.ci .cc input{width:100%;padding:6px;border:1px solid #e0e0e0;border-radius:5px;font-size:12px;margin-top:4px}
.rwbox{margin-top:6px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px}
.rwbox.fail-box{background:#ffebee;border-color:#ef9a9a}
.rwbox .rwl{font-size:11px;font-weight:600;margin-bottom:5px}
.rwbox .rwa{display:flex;gap:5px}

/* BANNERS */
.ab{padding:10px 14px;border-radius:10px;margin:5px 0;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;cursor:pointer;color:#fff}
.ab .abc{background:rgba(255,255,255,.3);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ab-rw{background:linear-gradient(135deg,#ff8f00,#e65100)}.ab-fail{background:linear-gradient(135deg,#e53935,#b71c1c)}

/* APPROVAL */
.ap-bar{background:linear-gradient(135deg,#1a1a2e,#283593);color:#fff;border-radius:10px;padding:16px;margin:10px 0;text-align:center}
.ap-bar h3{font-size:15px;margin-bottom:6px}.ap-bar .aps{font-size:12px;opacity:.8;margin-bottom:8px}

/* SUMMARY */
.sr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.sc{background:var(--card);border-radius:10px;padding:8px;text-align:center;box-shadow:var(--shadow)}
.sc .n{font-size:20px;font-weight:700}.sc .l{font-size:9px;color:#888;margin-top:1px}

/* PHOTO GRID */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.photo-card{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.photo-card img{width:100%;height:120px;object-fit:cover;cursor:pointer}
.photo-card .pc-info{padding:6px;font-size:11px;color:#666}
.photo-upload{border:2px dashed #ccc;border-radius:8px;padding:20px;text-align:center;cursor:pointer;color:#888;font-size:13px}
.photo-upload:hover{border-color:var(--blue);color:var(--blue)}

/* FEATURES LIST */
.feat-list{list-style:none}.feat-list li{padding:8px 12px;background:var(--card);border-radius:8px;margin:4px 0;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.feat-list li::before{content:'✅';font-size:14px}

/* BUILDSHEET */
.bs-section{background:var(--card);border-radius:var(--r);padding:14px;margin:8px 0;box-shadow:var(--shadow)}
.bs-section h3{font-size:14px;color:var(--navy);margin-bottom:8px}

/* VISUAL STANDARDS */
.vs-card{background:var(--card);border-radius:var(--r);padding:14px;margin:8px 0;box-shadow:var(--shadow)}
.vs-card h3{font-size:14px;color:var(--navy);margin-bottom:6px}
.vs-card .vs-desc{font-size:12px;color:#666;margin-bottom:8px}
.vs-examples{display:flex;gap:8px;overflow-x:auto}
.vs-ex{flex-shrink:0;width:140px;border-radius:8px;overflow:hidden;border:2px solid #e0e0e0}
.vs-ex img{width:100%;height:100px;object-fit:cover}
.vs-ex .vl{padding:4px 6px;font-size:10px;text-align:center;font-weight:600}
.vs-ex.good{border-color:var(--green)}.vs-ex.good .vl{color:var(--green);background:#e8f5e9}
.vs-ex.bad{border-color:var(--red)}.vs-ex.bad .vl{color:var(--red);background:#ffebee}

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:540px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.he{padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:11px;display:flex;gap:6px}
.he .ht{color:#999;min-width:120px}

@media(max-width:600px){.sr{grid-template-columns:repeat(3,1fr)}.topbar h1{font-size:14px}}
</style>
</head>

</div>

<div id="view-detail" class="view">

<div class="modal-overlay" id="mo"><div class="modal" id="mc"></div></div>

// ── STATS ──
function iSt(t,gid,num){const x=(t.checks||{})[gid+'|'+num];return x?x.status:null;}
function stats(t,gid){
  let p=0,f=0,rw=0,pn=0,tot=0,dn=0;
  const items=gid?G[gid].items:GO.flatMap(g=>G[g].items.map(i=>({...i,_g:g})));
  for(const it of items){tot++;const s=iSt(t,gid||it._g,it.num);
    if(!s){pn++;continue;}
    if(s==='pass'||s==='recheck-pass'){p++;dn++;}
    else if(s==='fail'||s==='recheck-fail'){f++;dn++;}
    else if(s==='rework'){rw++;}
  }
  return{pass:p,fail:f,rework:rw,pending:pn,total:tot,done:dn};
}

// ── LIST ──
function renderList(){
  const el=$('tlist'),no=$('no-t');
  if(!TT.length){el.innerHTML='';no.style.display='block';return;}
  no.style.display='none';
  el.innerHTML=TT.map(t=>{
    const s=stats(t);const pct=s.total?Math.round(s.done/s.total*100):0;
    const clr=pct===100?'var(--green)':pct>50?'var(--blue)':pct>0?'var(--orange)':'#ccc';
    const cls=s.fail>0?'has-issues':pct===100&&t.approved?'complete':'in-progress';
    return `<div class="trailer-card ${cls}" onclick="openT('${t.id}')">
      <div class="info">
        <h3>${e(t.customer)} — ${e(t.model)}</h3>
        <p>${e(t.inv)} · ${Fs(t.created)}</p>
        <p style="margin-top:2px;font-size:11px">✅${s.pass} 🔄${s.rework} ❌${s.fail} ⏳${s.pending}${t.approved?' · ✔️Approved':''}</p>
      </div>
      <div style="text-align:right">
        <div class="pct" style="color:${clr}">${pct}%</div>
        <div class="progress-bar"><div class="fill" style="width:${pct}%;background:${clr}"></div></div>
      </div>
    </div>`;
  }).join('');
}

function createT(){

  let model=$('i-model').value;if(model==='__c')model=$('i-cmod').value.trim();
  if(!customer||!inv||!model){alert('Fill all fields');return;}
  const bs=$('i-bs').value.trim();
  TT.unshift({id:'tr_'+Date.now(),customer,inv,model,created:N(),checks:{},history:[],gateTimes:{},photos:{},buildsheet:bs,approved:null,approvedAt:null});
  sv();openT(TT[0].id);
}

  $('d-sum').innerHTML=`
    <div class="sc"><div class="n" style="color:var(--green)">${s.pass}</div><div class="l">Pass</div></div>
    <div class="sc"><div class="n" style="color:var(--orange)">${s.rework}</div><div class="l">Rework</div></div>
    <div class="sc"><div class="n" style="color:var(--red)">${s.fail}</div><div class="l">Fail</div></div>
    <div class="sc"><div class="n" style="color:var(--blue)">${s.pending}</div><div class="l">Pending</div></div>

  $('d-banners').innerHTML=banners;

  let ap='';

  renderMainContent(t);
}

function switchMain(tab){cTab=tab;renderD();}

function renderMainContent(t){
  const mc=$('main-content');
  if(cTab==='gates')renderGates(t,mc);
  else if(cTab==='buildsheet')renderBuildsheet(t,mc);
  else if(cTab==='features')renderFeatures(t,mc);
  else if(cTab==='standards')renderStandards(t,mc);
  else if(cTab==='photos')renderPhotos(t,mc);
  else if(cTab==='layout')renderLayout(t,mc);
}

function renderGates(t,mc){
  let html=`<div class="gate-tabs" style="margin-top:8px">${GO.map(gid=>{

  // Inspector
  html+=`<div class="bar bar-insp"><label style="color:var(--blue)">👤 Inspector:</label>
    <select id="sel-insp"><option value="">Select...</option>
    <option>Desiree</option><option>Nicolas</option><option>Mehran</option><option>David</option><option>Jeff</option></select></div>`;

  // Checklist
  const gate=G[cGate];let secs=[],cur=null;
  for(const it of gate.items){if(!cur||cur.name!==it.section){cur={name:it.section,grp:it.grp,items:[]};secs.push(cur);}cur.items.push(it);}

  html+=secs.map(sec=>{
    const done=sec.items.filter(it=>{const s=iSt(t,cGate,it.num);return s&&s!=='rework';}).length;
    const secKey=cGate+'_'+sec.grp;
    const photoCount=Object.keys(t.photos||{}).filter(k=>k.startsWith(secKey+'_')).length;
    return `<div class="sec-hdr"><span>${sec.grp}. ${sec.name}</span><span class="cnt">${done}/${sec.items.length}${photoCount?' · 📸'+photoCount:''} <button class="photo-btn" onclick="addSectionPhoto('${secKey}','${e(sec.name)}')">📸</button></span></div>`
      +sec.items.map(it=>renderCI(t,it)).join('');
  }).join('');

  mc.innerHTML=html;
}

function sGate(g){cGate=g;renderD();}
function startGT(){const t=Tr(cId);if(!t.gateTimes)t.gateTimes={};t.gateTimes[cGate]={start:N(),end:null};t.history.push({action:'gate-start',gate:cGate,at:N()});sv();renderD();}
function endGT(){const t=Tr(cId);if(t.gateTimes&&t.gateTimes[cGate])t.gateTimes[cGate].end=N();t.history.push({action:'gate-end',gate:cGate,at:N()});sv();renderD();}

function renderCI(t,item){
  const key=cGate+'|'+item.num;const x=(t.checks||{})[key]||{};const st=x.status||'';
  const cls=st?'st-'+st:'';
  let act='';
  if(st==='rework'){
    act=`<div class="rwbox"><div class="rwl" style="color:var(--orange)">🔄 Rework — ${e(x.by)} · ${Fs(x.at)}</div>
    <div class="rwa"><button class="btn btn-sm btn-green" onclick="recheck('${key}','pass')">✅ Pass</button>
    <button class="btn btn-sm btn-danger" onclick="recheck('${key}','fail')">❌ Fail</button></div></div>`;
  } else if(st==='fail'||st==='recheck-fail'){
    act=`<div class="rwbox fail-box"><div class="rwl" style="color:var(--red)">❌ Failed — ${e(st==='recheck-fail'?x.recheckBy:x.by)} · ${Fs(st==='recheck-fail'?x.recheckAt:x.at)}</div>
    <div class="rwa"><button class="btn btn-sm btn-orange" onclick="setSt('${key}','rework')">🔄 Rework</button>
    <button class="btn btn-sm btn-green" onclick="setSt('${key}','pass')">✅ Override</button></div></div>`;
  }
  const sp=st==='pass'||st==='recheck-pass'?'sp':'';
  const sr=st==='rework'?'sr':'';const sf=st==='fail'||st==='recheck-fail'?'sf':'';
  const btns=st!=='rework'&&st!=='fail'&&st!=='recheck-fail'?
    `<div class="ca"><button class="${sp}" onclick="setSt('${key}','pass')">✅</button><button class="${sr}" onclick="setSt('${key}','rework')">🔄</button><button class="${sf}" onclick="setSt('${key}','fail')">❌</button></div>`:'';

  let meta='';
  if(x.by)meta+=`<div class="cm">👤 ${e(x.by)} · ${Fs(x.at)}</div>`;
  if(x.recheckBy)meta+=`<div class="cm">🔄 ${e(x.recheckBy)} · ${Fs(x.recheckAt)}</div>`;

  return `<div class="ci ${cls}"><div class="ct"><span class="cn">${item.num}</span><span class="cd">${e(item.desc)}</span>${btns}</div>${act}${meta}<div class="cc"><input placeholder="Notes..." value="${e(x.comment)}" onchange="setCmt('${key}',this.value)"></div></div>`;
}

function getI(){const el=document.getElementById('sel-insp');if(!el||!el.value){alert('Select inspector');return null;}return el.value;}
function setSt(key,status){const i=getI();if(!i)return;const t=Tr(cId);if(!t.checks)t.checks={};const prev=(t.checks[key]||{}).status||'pending';t.checks[key]={...t.checks[key],status,by:i,at:N(),comment:(t.checks[key]||{}).comment||''};t.approved=null;t.approvedAt=null;t.history.push({key,from:prev,to:status,by:i,at:N()});sv();renderD();}
function recheck(key,res){const i=getI();if(!i)return;const t=Tr(cId);const prev=(t.checks[key]||{}).status;const fin='recheck-'+res;t.checks[key]={...t.checks[key],status:fin,recheckBy:i,recheckAt:N()};t.approved=null;t.approvedAt=null;t.history.push({key,from:prev,to:fin,by:i,at:N()});sv();renderD();}
function setCmt(key,v){const t=Tr(cId);if(!t.checks)t.checks={};if(!t.checks[key])t.checks[key]={};t.checks[key].comment=v;sv();}
function approve(){if(!confirm('Final Approval by Hakan Yasar?'))return;const t=Tr(cId);t.approved='Hakan Yasar';t.approvedAt=N();t.history.push({action:'approval',by:'Hakan Yasar',at:N()});sv();renderD();}

// ══════════════════════════════════════════

  const stds=[
    {title:'Cabinet Gap Tolerance',desc:'Maximum gap between cabinet and wall: ≤ ½". Shim required if gap > ¼".',good:'Gap ≤ ¼" — flush fit',bad:'Gap > ½" — reject'},

    <p style="font-size:12px;color:#888;margin-bottom:12px">Reference standards for inspection. Upload example photos for each.</p>
    ${stds.map((s,i)=>`<div class="vs-card">

          <div style="font-size:24px;padding:10px">✅</div><div class="vl">GOOD: ${e(s.good)}</div>
        </div>
        <div class="vs-ex bad" style="min-height:60px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer" onclick="uploadStdPhoto('std_${i}_bad','${e(s.title)} — REJECT')">
          <div style="font-size:24px;padding:10px">❌</div><div class="vl">REJECT: ${e(s.bad)}</div>

    <input type="file" id="std-photo-input" accept="image/*" capture="environment" style="display:none">

function getStdPhotos(t,idx){
  const photos=Object.entries(t.photos||{}).filter(([k])=>k.startsWith('std_'+idx+'_'));
  return photos.map(([k,v])=>`<div class="vs-ex ${k.includes('good')?'good':'bad'}"><img src="${v.data}" onclick="viewPhoto('${k}')"><div class="vl">${e(v.label||'')}</div></div>`).join('');
}

let pendingStdKey='',pendingStdLabel='';
function uploadStdPhoto(key,label){
  pendingStdKey=key;pendingStdLabel=label;
  const inp=document.getElementById('std-photo-input');
  inp.onchange=ev=>{
    const file=ev.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      const t=Tr(cId);if(!t.photos)t.photos={};
      t.photos[pendingStdKey+'_'+Date.now()]={data:e.target.result,label:pendingStdLabel,at:N()};
      sv();renderD();
    };reader.readAsDataURL(file);
  };
  inp.click();
}

function renderPhotos(t,mc){
  const allPhotos=Object.entries(t.photos||{}).sort((a,b)=>(b[1].at||'').localeCompare(a[1].at||''));
  mc.innerHTML=`<div style="margin-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="color:var(--navy)">📸 All Photos (${allPhotos.length})</h3>
      <button class="btn btn-sm btn-primary" onclick="addGenPhoto()">+ Add Photo</button>
    </div>
    <input type="file" id="gen-photo-input" accept="image/*" capture="environment" style="display:none" onchange="handleGenPhoto(event)">
    ${allPhotos.length?`<div class="photo-grid">${allPhotos.map(([k,v])=>`<div class="photo-card">
      <img src="${v.data}" onclick="viewPhoto('${k}')">
      <div class="pc-info">${e(v.label||'General')} · ${Fs(v.at)}
      <button onclick="delPhoto('${k}')" style="float:right;background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer">×</button></div>
    </div>`).join('')}</div>`:'<p style="text-align:center;color:#aaa;padding:30px">No photos yet. Use 📸 buttons in Quality Gates sections or add here.</p>'}

  const reader=new FileReader();
  reader.onload=e=>{
    const t=Tr(cId);if(!t.photos)t.photos={};

    t.photos['gen_'+Date.now()]={data:e.target.result,label,at:N()};

}

function addSectionPhoto(secKey,secName){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=ev=>{
    const file=ev.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      const t=Tr(cId);if(!t.photos)t.photos={};
      t.photos[secKey+'_'+Date.now()]={data:e.target.result,label:secName,at:N()};
      sv();renderD();

function viewPhoto(key){
  const t=Tr(cId);const p=(t.photos||{})[key];if(!p)return;

// ══════════════════════════════════════════
// ISSUES MODAL
// ══════════════════════════════════════════
function showIssues(type){
  const t=Tr(cId);
  const lbl=type==='fail'?'❌ Failed Items':'🔄 Rework Items';
  const match=type==='fail'?s=>s==='fail'||s==='recheck-fail':s=>s==='rework';
  let html=`<h2>${lbl}</h2>`;
  for(const gid of GO){
    const its=G[gid].items.filter(it=>match(iSt(t,gid,it.num)));
    if(!its.length)continue;
    html+=`<div style="font-weight:700;margin:10px 0 5px;color:${GC[gid]}">${GI[gid]} ${GN[gid]} (${its.length})</div>`;
    for(const it of its){
      const key=gid+'|'+it.num;const x=t.checks[key]||{};
      html+=`<div style="padding:8px;background:${type==='fail'?'#ffebee':'#fff8e1'};border-radius:8px;margin:3px 0;border-left:3px solid ${type==='fail'?'var(--red)':'var(--orange)'}">
        <strong>${it.num}</strong> — ${e(it.desc)}
        <div style="font-size:10px;color:#888;margin:3px 0">${e(x.by||'')} · ${Fs(x.at)}</div>
        ${type==='rework'?`<div style="display:flex;gap:5px;margin-top:5px">
          <button class="btn btn-sm btn-green" onclick="recheckMod('${gid}','${key}','pass')">✅ Pass</button>
          <button class="btn btn-sm btn-danger" onclick="recheckMod('${gid}','${key}','fail')">❌ Fail</button></div>`
        :`<div style="display:flex;gap:5px;margin-top:5px">
          <button class="btn btn-sm btn-orange" onclick="stMod('${gid}','${key}','rework')">🔄 Rework</button>
          <button class="btn btn-sm btn-green" onclick="stMod('${gid}','${key}','pass')">✅ Override</button></div>`}
      </div>`;
    }
  }
  html+=`<button class="btn btn-gray btn-block" style="margin-top:14px" onclick="closeMod()">Close</button>`;
  showMod(html);
}
function recheckMod(gid,key,res){const i=getI();if(!i)return;const t=Tr(cId);const prev=(t.checks[key]||{}).status;t.checks[key]={...t.checks[key],status:'recheck-'+res,recheckBy:i,recheckAt:N()};t.approved=null;t.approvedAt=null;t.history.push({key,from:prev,to:'recheck-'+res,by:i,at:N()});sv();renderD();showIssues(res==='fail'?'fail':'rework');}
function stMod(gid,key,status){const i=getI();if(!i)return;const t=Tr(cId);const prev=(t.checks[key]||{}).status||'pending';t.checks[key]={...t.checks[key],status,by:i,at:N()};t.approved=null;t.approvedAt=null;t.history.push({key,from:prev,to:status,by:i,at:N()});sv();renderD();showIssues('fail');}

// ══════════════════════════════════════════
// HISTORY & UTILS
// ══════════════════════════════════════════
function showHist(){
  const t=Tr(cId);const h=(t.history||[]).slice().reverse().slice(0,200);
  let html=`<h2>📋 Log — ${e(t.customer)}</h2><p style="font-size:11px;color:#888;margin-bottom:10px">${e(t.inv)}</p>`;
  if(!h.length)html+='<p style="color:#aaa">No entries.</p>';
  else html+=h.map(x=>{
    const em={pass:'✅',fail:'❌',rework:'🔄','recheck-pass':'✅♻️','recheck-fail':'❌♻️','gate-start':'▶️','gate-end':'⏹','approval':'🏆'}[x.to||x.action]||'📝';
    const lb=x.action==='gate-start'?`Started ${GN[x.gate]||x.gate}`:x.action==='gate-end'?`Finished ${GN[x.gate]||x.gate}`:x.action==='approval'?'Final Approval':`${(x.key||'').split('|')[1]||''} → ${x.to}`;
    return `<div class="he"><span class="ht">${Fs(x.at)}</span><span>${em} ${lb} — ${e(x.by||'')}</span></div>`;
  }).join('');
  html+=`<button class="btn btn-gray btn-block" style="margin-top:14px" onclick="closeMod()">Close</button>`;
  showMod(html);
}

function delT(){const t=Tr(cId);if(!confirm('Delete '+t.customer+' — '+t.inv+'?'))return;TT=TT.filter(x=>x.id!==cId);sv();showView('list');}
function exportData(){const b=new Blob([JSON.stringify(TT,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='escape-qg-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);}

function showMod(h){$('mc').innerHTML=h;$('mo').classList.add('active');}
function closeMod(){$('mo').classList.remove('active');}
$('mo').onclick=ev=>{if(ev.target===$('mo'))closeMod();};

renderList();
</script>
