<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>QualityGates Pro™</title>
<style>
:root{--navy:#1a1a2e;--blue:#0d47a1;--green:#2e7d32;--red:#c62828;--orange:#e65100;--purple:#6a1b9a;--gray:#546e7a;--yellow:#f9a825;--bg:#f5f6fa;--card:#fff;--shadow:0 2px 12px rgba(0,0,0,.08);--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#333;-webkit-tap-highlight-color:transparent}
.topbar{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:16px;font-weight:700}.topbar h1 span{opacity:.6;font-weight:400;font-size:12px;display:block}
.topbar-actions{display:flex;gap:6px}
.topbar-actions button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;min-height:44px;min-width:44px}
.view{display:none;padding:14px;max-width:960px;margin:0 auto}.view.active{display:block}
.btn{display:inline-block;padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.btn-primary{background:var(--blue);color:#fff}.btn-danger{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}.btn-orange{background:var(--orange);color:#fff}
.btn-yellow{background:var(--yellow);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-gray{background:#78909c;color:#fff}.btn-navy{background:var(--navy);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px}.btn-block{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* HOME SCREEN */
.home-actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.home-actions button{flex:1;min-width:120px}
.trailer-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:5px solid transparent;transition:transform .1s}
.trailer-card:active{transform:scale(.98)}
.trailer-card.approved{border-left-color:var(--green)}
.trailer-card.has-rejections{border-left-color:var(--red)}
.trailer-card.has-holds{border-left-color:var(--yellow)}
.trailer-card.has-letgos{border-left-color:var(--blue)}
.trailer-card.in-progress{border-left-color:#bbb}
.trailer-card .info h3{font-size:15px;color:var(--navy)}.trailer-card .info p{font-size:12px;color:#888;margin-top:2px}
.trailer-card .pct{font-size:22px;font-weight:700}
.progress-bar{width:100px;height:5px;background:#e0e0e0;border-radius:3px;margin-top:3px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px}
.status-pills{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:10px;padding:2px 6px;border-radius:10px;background:#f0f0f0;color:#666}

/* FORM */
.form-card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.form-card h2{font-size:17px;margin-bottom:14px;color:var(--navy)}
.fg{margin-bottom:12px}.fg label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;min-height:44px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue)}

/* MAIN TABS */
.main-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch;border-bottom:2px solid #e0e0e0;margin-bottom:10px}
.main-tab{flex-shrink:0;padding:8px 14px;border-radius:8px 8px 0 0;background:#e8eaf6;color:var(--navy);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px;display:flex;align-items:center}
.main-tab.active{background:var(--navy);color:#fff}

/* GATE TABS */
.gate-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;margin-bottom:8px}
.gate-tab{flex-shrink:0;padding:8px 14px;border-radius:18px;background:#e8eaf6;color:var(--navy);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;position:relative;min-height:44px;display:flex;align-items:center;gap:4px}
.gate-tab.active{background:var(--navy);color:#fff}
.gate-tab .badge{position:absolute;top:-3px;right:-3px;color:#fff;font-size:9px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}

/* INSPECTOR BAR */
.insp-bar{background:#e3f2fd;border-radius:10px;padding:12px;margin:8px 0;position:sticky;top:60px;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.insp-bar label{font-weight:600;font-size:12px;color:var(--blue);display:block;margin-bottom:6px}
.insp-bar select{width:100%;padding:10px;border:2px solid #90caf9;border-radius:8px;font-size:14px;background:#fff}
.insp-bar .change-link{font-size:11px;color:var(--blue);text-decoration:underline;cursor:pointer;margin-top:4px;display:inline-block}

/* GATE TIMER */
.timer-bar{background:#f3e5f5;border-radius:8px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.timer-bar .time{font-family:monospace;font-size:16px;font-weight:700;color:var(--purple)}

/* SECTION CARDS */
.section-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.section-card{background:var(--card);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;transition:all .2s}
.section-header{background:#e8eaf6;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:44px}
.section-header h4{font-size:13px;color:var(--navy);font-weight:700;flex:1}
.section-progress{font-size:11px;color:#666;background:#fff;padding:3px 8px;border-radius:10px}
.section-icons{display:flex;gap:4px;margin-left:8px}
.section-content{display:none;padding:8px;background:#fafafa}
.section-content.expanded{display:block}
.section-card.expanded .section-header{background:var(--navy);color:#fff}
.section-card.expanded .section-header h4{color:#fff}
.section-card.expanded .section-progress{background:rgba(255,255,255,.2);color:#fff}

/* CHECK ITEMS */
.ci{background:var(--card);border-radius:10px;padding:12px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);border-left:4px solid #ddd;transition:all .2s}
.ci.st-pass{border-left-color:var(--green);background:#f1f8e9}
.ci.st-rejected{border-left-color:var(--red);background:#ffebee}
.ci.st-hold{border-left-color:var(--yellow);background:#fffde7}
.ci.st-letgo{border-left-color:var(--blue);background:#e3f2fd}
.ci .ci-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.ci .ci-num{font-weight:700;color:var(--blue);font-size:12px;min-width:36px;background:#e3f2fd;padding:2px 6px;border-radius:4px}
.ci .ci-desc{flex:1;font-size:13px;line-height:1.4}
.ci .ci-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ci .ci-actions button{flex:1;min-width:70px;padding:8px 6px;font-size:11px;border-radius:6px;border:2px solid #e0e0e0;background:#fff;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .1s}
.ci .ci-actions button:active{transform:scale(.95)}
.ci .ci-actions button.active-pass{background:var(--green);color:#fff;border-color:var(--green)}
.ci .ci-actions button.active-rejected{background:var(--red);color:#fff;border-color:var(--red)}
.ci .ci-actions button.active-hold{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.ci .ci-actions button.active-letgo{background:var(--blue);color:#fff;border-color:var(--blue)}
.ci .ci-meta{font-size:10px;color:#888;margin-top:6px}
.ci .ci-notes{margin-top:8px}
.ci .ci-notes input{width:100%;padding:8px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px}
.ci .ci-media-btns{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ci .ci-media-btn{background:var(--gray);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.ci .ci-media-btn.recording{background:var(--red);animation:pulse 1s infinite}
.ci .ci-media-counts{font-size:11px;color:#666;margin-left:8px}
.ci .ci-media-counts span{margin:0 4px}

/* MEDIA PREVIEW MODAL */
.media-preview-modal .preview-img{width:100%;border-radius:8px;margin-bottom:12px;max-height:60vh;object-fit:contain}
.media-preview-modal video{width:100%;border-radius:8px;max-height:60vh}

/* STATUS BOXES */
.status-box{margin-top:10px;padding:10px;border-radius:8px;font-size:12px}
.status-box.rejected{background:#ffebee;border:1px solid #ef9a9a}
.status-box.hold{background:#fffde7;border:1px solid #ffe082}
.status-box.letgo{background:#e3f2fd;border:1px solid #90caf9}
.status-box .sb-title{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.status-box .sb-meta{font-size:10px;color:#666;margin-bottom:6px}
.status-box .sb-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* BANNERS */
.banner{padding:12px 14px;border-radius:10px;margin:8px 0;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;min-height:44px}
.banner .count{background:rgba(255,255,255,.3);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.banner-rejections{background:linear-gradient(135deg,var(--red),#b71c1c)}
.banner-holds{background:linear-gradient(135deg,var(--yellow),#f57f17);color:#333}
.banner-letgos{background:linear-gradient(135deg,var(--blue),#1565c0)}

/* SUMMARY TILES */
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
@media(min-width:600px){.summary-row{grid-template-columns:repeat(6,1fr)}}
.sum-tile{background:var(--card);border-radius:10px;padding:10px;text-align:center;box-shadow:var(--shadow);min-height:60px;display:flex;flex-direction:column;justify-content:center}
.sum-tile .num{font-size:22px;font-weight:700}.sum-tile .lbl{font-size:10px;color:#888;margin-top:2px}
.sum-tile.pass .num{color:var(--green)}
.sum-tile.rejected .num{color:var(--red)}
.sum-tile.hold .num{color:var(--yellow)}
.sum-tile.letgo .num{color:var(--blue)}
.sum-tile.pending .num{color:#999}

/* APPROVAL */
.approval-bar{background:linear-gradient(135deg,var(--navy),#283593);color:#fff;border-radius:12px;padding:16px;margin:12px 0;text-align:center}
.approval-bar h3{font-size:16px;margin-bottom:6px}.approval-bar .sub{font-size:12px;opacity:.8;margin-bottom:12px}
.approval-bar .timestamp{font-size:11px;opacity:.7;margin-top:8px}

/* REWORK DASHBOARD */
.rework-section{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.rework-section h3{font-size:14px;color:var(--navy);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #e0e0e0}
.rework-item{padding:10px;background:#f5f5f5;border-radius:8px;margin-bottom:6px;border-left:3px solid var(--orange)}
.rework-item .ri-header{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.rework-item .ri-desc{font-size:12px;color:#555;margin-bottom:4px}
.rework-item .ri-meta{font-size:10px;color:#888}
.rework-item .ri-actions{display:flex;gap:6px;margin-top:8px}

/* PUNCH LIST */
.punch-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.punch-filters button{flex:1;min-width:80px}
.punch-filters button.active{background:var(--navy)}
.punch-item{padding:12px;background:var(--card);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.punch-item.resolved{border-left-color:var(--green);opacity:.7}
.punch-item .pi-header{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.punch-item .pi-reason{font-size:11px;color:var(--blue);background:#e3f2fd;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px}
.punch-item .pi-meta{font-size:10px;color:#888;margin-bottom:8px}
.punch-item .pi-notes{font-size:12px;color:#555;margin-bottom:8px;padding:8px;background:#f5f5f5;border-radius:6px}

/* PHOTO/VIDEO GRID */
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
@media(min-width:600px){.photo-grid{grid-template-columns:repeat(3,1fr)}}
.photo-card{background:var(--card);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.photo-card img{width:100%;height:120px;object-fit:cover;cursor:pointer}
.photo-card video{width:100%;height:120px;object-fit:cover;cursor:pointer}
.photo-card .pc-info{padding:6px;font-size:10px;color:#666}
.photo-card .play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
.photo-upload{border:2px dashed #ccc;border-radius:8px;padding:30px 20px;text-align:center;cursor:pointer;color:#888;font-size:13px;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.photo-upload:hover{border-color:var(--blue);color:var(--blue)}

/* FEATURES */
.feat-list{list-style:none}.feat-list li{padding:10px 12px;background:var(--card);border-radius:8px;margin:4px 0;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.feat-list li::before{content:'✅';font-size:14px}

/* BUILDSHEET */
.bs-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.bs-card h3{font-size:14px;color:var(--navy);margin-bottom:8px}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:modalIn .2s}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modal h2{font-size:16px;color:var(--navy);margin-bottom:14px}
.modal .form-group{margin-bottom:14px}
.modal .form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#555}
.modal .form-group select,.modal .form-group input,.modal .form-group textarea{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;min-height:44px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1}

/* HISTORY */
.history-item{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:11px;display:flex;gap:8px;align-items:flex-start}
.history-item .time{color:#999;min-width:60px;font-size:10px}
.history-item .icon{font-size:14px}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 20px;color:#aaa;font-size:14px}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5}

/* FLOATING ACTION */
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}

/* JUMP BUTTON */
.jump-btn{background:#f0f0f0;border:none;padding:8px 12px;border-radius:6px;font-size:11px;cursor:pointer;color:#555}

/* HAKAN BADGE */
.hakan-badge{background:linear-gradient(135deg,var(--purple),#8e24aa);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🛡️ QualityGates Pro™</h1>
  <div class="topbar-actions">
    <button onclick="showView('list')">🏠</button>
    <button onclick="showReworkDashboard()">🔧</button>
    <button onclick="showPunchList()">📋</button>
    <button onclick="exportData()">📤</button>
  </div>
</div>

<!-- HOME / TRAILER LIST -->
<div id="view-list" class="view active">
  <div class="home-actions">
    <button class="btn btn-primary" onclick="showView('new')">+ New Trailer</button>
    <button class="btn btn-navy" onclick="showReworkDashboard()">🔧 Rework Dashboard</button>
    <button class="btn btn-blue" onclick="showPunchList()">📋 Punch List</button>
  </div>
  <div id="tlist"></div>
  <div id="no-t" class="empty-state" style="display:none">
    <div class="icon">🚐</div>
    <p>No trailers yet.<br>Tap <b>+ New Trailer</b> to start</p>
  </div>
</div>

<!-- NEW TRAILER -->
<div id="view-new" class="view">
  <div class="form-card">
    <h2>🆕 New Trailer Card</h2>
    <div class="fg"><label>Customer Name *</label><input id="i-cust" placeholder="John Smith"></div>
    <div class="fg"><label>Inventory Number *</label><input id="i-inv" placeholder="ET-2026-0142"></div>
    <div class="fg"><label>Trailer Model *</label>
      <select id="i-model">
        <option value="">Select...</option>
        <option>ET 17</option><option>ET 19</option><option>ET 21</option>
        <option>ET 21NE</option><option>ET 23</option><option>ET 25</option>
        <option value="__c">Custom...</option>
      </select>
    </div>
    <div class="fg" id="cg" style="display:none"><label>Custom Model</label><input id="i-cmod"></div>
    <div class="fg"><label>Buildsheet Notes (optional)</label><textarea id="i-bs" rows="3" placeholder="Special options, customer requests, deviations..."></textarea></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-gray btn-sm" onclick="showView('list')">Cancel</button>
      <button class="btn btn-primary" style="flex:1" onclick="createT()">Create Trailer</button>
    </div>
  </div>
</div>

<!-- TRAILER DETAIL -->
<div id="view-detail" class="view">
  <div id="d-hdr"></div>
  <div class="summary-row" id="d-sum"></div>
  <div id="d-banners"></div>
  <div id="d-approval"></div>
  <div class="main-tabs" id="main-tabs"></div>
  <div id="main-content"></div>
</div>

<!-- REWORK DASHBOARD -->
<div id="view-rework" class="view">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <button class="btn btn-gray btn-sm" onclick="showView('list')">← Back</button>
    <h2 style="font-size:18px;color:var(--navy)">🔧 Rework Dashboard</h2>
  </div>
  <div id="rework-content"></div>
</div>

<!-- PUNCH LIST -->
<div id="view-punch" class="view">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn btn-gray btn-sm" onclick="showView('list')">← Back</button>
    <h2 style="font-size:18px;color:var(--navy)">📋 Punch List</h2>
  </div>
  <div class="punch-filters" id="punch-filters">
    <button class="btn btn-sm active" onclick="setPunchFilter('open')">Open</button>
    <button class="btn btn-sm" onclick="setPunchFilter('resolved')">Resolved</button>
    <button class="btn btn-sm" onclick="setPunchFilter('all')">All</button>
  </div>
  <div id="punch-content"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="mo"><div class="modal" id="mc"></div></div>

<script>
// ═════════════════════════════════════════════════════════════════════════════
// GATE DATA

// Get inspector for current gate (with fallback to default)
function getCurrentGateInspector(t){
  if(!t.gateInspectors)t.gateInspectors={};
  return t.gateInspectors[currentGate]||getDefaultInspector();
}

  if(!t.gateInspectors)t.gateInspectors={};

}

// STATS CALCULATION
// ═════════════════════════════════════════════════════════════════════════════
function getItemStatus(trailer,gateId,itemNum){
  const key=`${gateId}|${itemNum}`;
  const check=(trailer.checks||{})[key];
  return check?check.status:null;
}

function calcStats(trailer,gateId=null){
  let pass=0,rejected=0,hold=0,letgo=0,pending=0,total=0;
  const items=gateId?G[gateId].items:GO.flatMap(g=>G[g].items.map(i=>({...i,_g:g})));
  for(const it of items){
    total++;
    const st=getItemStatus(trailer,gateId||it._g,it.num);
    if(!st){pending++;continue;}
    if(st==='pass')pass++;
    else if(st==='rejected')rejected++;
    else if(st==='hold')hold++;
    else if(st==='letgo')letgo++;
  }
  const done=pass+rejected+hold+letgo;
  const pct=total?Math.round((done/total)*100):0;
  return{pass,rejected,hold,letgo,pending,done,total,pct};
}

function renderList(){

  if(!trailers.length){el.innerHTML='';no.style.display='block';return;}
  no.style.display='none';
  el.innerHTML=trailers.map(t=>{
    const s=calcStats(t);
    const pct=s.pct;
    const clr=pct===100?'var(--green)':pct>50?'var(--blue)':pct>0?'var(--orange)':'#ccc';
    let cls='in-progress';
    if(t.approved)cls='approved';
    else if(s.rejected>0)cls='has-rejections';
    else if(s.hold>0)cls='has-holds';
    else if(s.letgo>0)cls='has-letgos';
    return`<div class="trailer-card ${cls}" onclick="openTrailer('${t.id}')">
      <div class="info">
        <h3>${e(t.customer)} — ${e(t.model)}</h3>
        <p>${e(t.inv)} · ${fmtDate(t.created)}</p>

// QUALITY GATES TAB
// ═════════════════════════════════════════════════════════════════════════════
function renderGatesTab(t,mc){
  // Gate tabs with badges
  let html=`<div class="gate-tabs">${GO.map(gid=>{
    const gs=calcStats(t,gid);
    const act=gid===currentGate?'active':'';
    let badge='';
    if(gs.rejected>0)badge=`<span class="badge" style="background:var(--red)">${gs.rejected}</span>`;
    else if(gs.hold>0)badge=`<span class="badge" style="background:var(--yellow);color:#333">${gs.hold}</span>`;
    else if(gs.pending===0&&gs.total>0)badge=`<span class="badge" style="background:var(--green)">✓</span>`;
    return`<div class="gate-tab ${act}" onclick="switchGate('${gid}')">${GI[gid]} ${GN[gid]}${badge}</div>`;
  }).join('')}</div>`;

  // Inspector bar (per-gate)
  const gateInspector=getCurrentGateInspector(t);
  const defaultInsp=getDefaultInspector();
  html+=`<div class="insp-bar">
    <label>👤 Inspector for ${GN[currentGate]}:</label>
    <select id="gate-insp" onchange="onGateInspChange(this.value)">
      <option value="">Select inspector...</option>
      ${INSPECTORS.map(i=>`<option value="${e(i)}" ${i===gateInspector?'selected':''}>${e(i)}${i===defaultInsp?' (default)':''}</option>`).join('')}
    </select>
  </div>`;

  // Timer bar
  const gt=(t.gateTimes||{})[currentGate]||{};
  html+=`<div class="timer-bar">
    <span style="font-weight:600">⏱️ ${GN[currentGate]} Timer</span>
    ${!gt.start?`<button class="btn btn-sm btn-primary" onclick="startGateTimer()">▶ Start</button>`:
      gt.end?`<span class="time">${formatDuration(gt.start,gt.end)}</span><span>${fmtShort(gt.start)} → ${fmtShort(gt.end)}</span>`:
      `<span class="time" id="live-timer">${formatDuration(gt.start,now())}</span><button class="btn btn-sm btn-orange" onclick="endGateTimer()">⏹ Stop</button>`}
  </div>`;

  // Section controls
  html+=`<div class="section-controls">
    <button class="jump-btn" onclick="expandAll()">Expand All</button>
    <button class="jump-btn" onclick="collapseAll()">Collapse All</button>
    <button class="jump-btn" onclick="jumpToFirstIncomplete()">Jump to First Incomplete</button>
  </div>`;

  // Build sections
  const gate=G[currentGate];
  const sections=buildSections(gate.items);

  html+=sections.map(sec=>{
    const secKey=`${currentGate}_${sec.grp}`;
    const isExpanded=expandedSections[secKey];
    const done=sec.items.filter(it=>{
      const st=getItemStatus(t,currentGate,it.num);
      return st&&st!=='pending';
    }).length;
    const hasRejected=sec.items.some(it=>getItemStatus(t,currentGate,it.num)==='rejected');
    const hasHold=sec.items.some(it=>getItemStatus(t,currentGate,it.num)==='hold');
    const hasLetGo=sec.items.some(it=>getItemStatus(t,currentGate,it.num)==='letgo');
    const icons=[];
    if(hasRejected)icons.push('🔴');
    if(hasHold)icons.push('🟡');
    if(hasLetGo)icons.push('⏭️');
    return`<div class="section-card ${isExpanded?'expanded':''}" id="sec-${sec.grp}">
      <div class="section-header" onclick="toggleSection('${sec.grp}')">
        <h4>${sec.grp}. ${e(sec.name)}</h4>
        <div class="section-icons">${icons.join('')}</div>
        <span class="section-progress">${done}/${sec.items.length}</span>
      </div>
      <div class="section-content ${isExpanded?'expanded':''}">
        ${sec.items.map(it=>renderCheckItem(t,it)).join('')}
      </div>
    </div>`;
  }).join('');

  mc.innerHTML=html;

  // Start live timer if running
  if(gt.start&&!gt.end){
    setInterval(()=>{
      const el=$('live-timer');
      if(el)el.textContent=formatDuration(gt.start,now());
    },1000);
  }
}

function buildSections(items){
  const secs=[];
  let cur=null;
  for(const it of items){
    if(!cur||cur.name!==it.section){
      cur={name:it.section,grp:it.grp,items:[]};
      secs.push(cur);
    }
    cur.items.push(it);
  }
  return secs;
}

function toggleSection(grp){
  const key=`${currentGate}_${grp}`;
  expandedSections[key]=!expandedSections[key];
  renderDetail();
}

function expandAll(){
  const gate=G[currentGate];
  const sections=buildSections(gate.items);
  sections.forEach(sec=>{expandedSections[`${currentGate}_${sec.grp}`]=true;});
  renderDetail();
}

function collapseAll(){
  expandedSections={};
  renderDetail();
}

function jumpToFirstIncomplete(){
  const t=getTrailer(currentTrailerId);
  const gate=G[currentGate];
  const sections=buildSections(gate.items);
  for(const sec of sections){
    const hasIncomplete=sec.items.some(it=>!getItemStatus(t,currentGate,it.num));
    if(hasIncomplete){
      expandedSections[`${currentGate}_${sec.grp}`]=true;
      renderDetail();
      setTimeout(()=>{
        const el=document.getElementById(`sec-${sec.grp}`);
        if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
      },50);
      return;
    }
  }
}

function switchGate(gid){currentGate=gid;renderDetail();}

function onGateInspChange(val){
  const t=getTrailer(currentTrailerId);
  setGateInspector(t,val);
}

function startGateTimer(){
  const t=getTrailer(currentTrailerId);
  if(!t.gateTimes)t.gateTimes={};
  t.gateTimes[currentGate]={start:now(),end:null};
  addHistory(t,'gate-start',currentGate);
  save();renderDetail();
}

function endGateTimer(){
  const t=getTrailer(currentTrailerId);
  if(t.gateTimes&&t.gateTimes[currentGate]){
    t.gateTimes[currentGate].end=now();
    addHistory(t,'gate-end',currentGate);
    save();renderDetail();
  }
}

function formatDuration(start,end){
  const ms=new Date(end)-new Date(start);
  const mins=Math.floor(ms/60000);
  const secs=Math.floor((ms%60000)/1000);
  return `${mins}m ${secs}s`;
}

function renderCheckItem(t,item){
  const key=`${currentGate}|${item.num}`;
  const check=(t.checks||{})[key]||{};
  const st=check.status;
  const cls=st?`st-${st}`:'';

  // Count photos, videos, voice notes for this item
  const photoCount=check.photoCount||0;
  const videoCount=check.videoCount||0;
  const voiceCount=check.voiceCount||0;

  let statusBox='';
  if(st==='rejected'){
    statusBox=`<div class="status-box rejected">
      <div class="sb-title">🔴 QC-Rejected</div>
      <div class="sb-meta">By ${e(check.by||'')} · ${fmtShort(check.at)}</div>
      ${check.dept?`<div>Dept: <strong>${e(check.dept)}</strong></div>`:''}
      ${check.fixAt?`<div>Fix at: ${e(check.fixAt)}</div>`:''}
      ${check.rejectComment?`<div>Comment: ${e(check.rejectComment)}</div>`:''}
      ${check.history?`<div style="margin-top:6px;font-size:10px;color:#888">Previously rejected ${check.history.length} time(s)</div>`:''}
      <div class="sb-actions">
        <button class="btn btn-sm btn-green" onclick="recheckItem('${key}','pass')">✅ Recheck Pass</button>
        <button class="btn btn-sm btn-danger" onclick="recheckItem('${key}','rejected')">🔴 Re-reject</button>
      </div>
    </div>`;
  }else if(st==='hold'){
    const awaiting=!check.decision;
    statusBox=`<div class="status-box hold">
      <div class="sb-title">🟡 QC-Hold — ${awaiting?'Awaiting Decision':`Decision: ${check.decision}`}</div>
      <div class="sb-meta">Escalated by ${e(check.by||'')} · ${fmtShort(check.at)}</div>
      ${awaiting?`<div style="margin:6px 0"><span class="hakan-badge">👑 ${HAKAN_NAME}</span></div>
      <div class="sb-actions">
        <button class="btn btn-sm btn-green" onclick="decideHold('${key}','pass')">✅ Pass</button>
        <button class="btn btn-sm btn-danger" onclick="decideHold('${key}','reject')">🔴 Reject</button>
        <button class="btn btn-sm btn-blue" onclick="decideHold('${key}','letgo')">⏭️ Let Go</button>
      </div>`:`<div>Decided by ${e(check.decisionBy)} · ${fmtShort(check.decisionAt)}</div>`}
    </div>`;
  }else if(st==='letgo'){
    statusBox=`<div class="status-box letgo">
      <div class="sb-title">⏭️ Let Go — ${e(check.letGoReason||'')}</div>
      <div class="sb-meta">By ${e(check.by||'')} · ${fmtShort(check.at)}</div>
      ${check.letGoNote?`<div>Note: ${e(check.letGoNote)}</div>`:''}
      ${check.resolved?`<div style="color:var(--green)">✅ Resolved by ${e(check.resolvedBy)} · ${fmtShort(check.resolvedAt)}</div>`:
      `<div class="sb-actions"><button class="btn btn-sm btn-green" onclick="resolveLetGo('${key}')">✅ Mark Resolved</button></div>`}
    </div>`;
  }

  const btns=!st||st==='pass'?`
    <div class="ci-actions">
      <button class="${st==='pass'?'active-pass':''}" onclick="setItemStatus('${key}','pass')">✅ Pass</button>
      <button class="" onclick="showRejectDialog('${key}')">🔴 Reject</button>
      <button class="" onclick="showHoldDialog('${key}')">🟡 Hold</button>
      <button class="" onclick="showLetGoDialog('${key}')">⏭️ Let Go</button>
    </div>`:'';

  // Media buttons row
  let mediaCounts='';
  const counts=[];
  if(photoCount)counts.push(`${photoCount} photo${photoCount!==1?'s':''}`);
  if(videoCount)counts.push(`${videoCount} video${videoCount!==1?'s':''}`);
  if(voiceCount)counts.push(`${voiceCount} voice`);
  if(counts.length)mediaCounts=`<span class="ci-media-counts">| ${counts.join(' · ')}</span>`;

  const mediaBtns=`<div class="ci-media-btns">
    <button class="ci-media-btn" onclick="takeItemPhoto('${key}')">📸 Photo</button>
    <button class="ci-media-btn" onclick="takeItemVideo('${key}')">🎥 Video</button>
    <button class="ci-media-btn" onclick="startVoiceRecording('${key}')">🎤 Voice</button>
    ${mediaCounts}
  </div>`;

  return`<div class="ci ${cls}">
    <div class="ci-header">
      <span class="ci-num">${item.num}</span>
      <span class="ci-desc">${e(item.desc)}</span>
    </div>
    ${btns}
    <div class="ci-notes">
      <input placeholder="Notes..." value="${e(check.notes||'')}" onchange="setItemNotes('${key}',this.value)">
    </div>
    ${mediaBtns}

    ${check.lastAction?`<div class="ci-meta">Last: ${check.lastAction} by ${e(check.lastBy)} · ${fmtShort(check.lastAt)}</div>`:''}
  </div>`;
}

// ═════════════════════════════════════════════════════════════════════════════
// ITEM ACTIONS
// ═════════════════════════════════════════════════════════════════════════════
function getCurrentInspector(){
  const t=getTrailer(currentTrailerId);
  return getCurrentGateInspector(t);
}

function setItemStatus(key,status){
  const insp=getCurrentInspector();
  if(!insp){alert('Please select an inspector for this gate first');return;}
  const t=getTrailer(currentTrailerId);
  if(!t.checks)t.checks={};
  const prev=(t.checks[key]||{}).status;
  t.checks[key]={...t.checks[key],status,by:insp,at:now(),lastAction:status,lastBy:insp,lastAt:now()};
  t.approved=null;t.approvedAt=null;
  addHistory(t,'check',key,prev,status,insp);
  save();renderDetail();
}

function showRejectDialog(key){
  const insp=getCurrentInspector();
  if(!insp){alert('Please select an inspector for this gate first');return;}
  showModal(`<h2>🔴 QC-Rejected</h2>
    <div class="form-group"><label>Department *</label><select id="rej-dept"><option value="">Select...</option>${REJECT_DEPTS.map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="form-group"><label>Fix at gate</label><select id="rej-fix"><option value="">Current gate</option>${GO.map(g=>`<option value="${g}">${GN[g]}</option>`).join('')}</select></div>
    <div class="form-group"><label>Comment</label><textarea id="rej-cmt" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmReject('${key}')">Confirm Rejection</button>
    </div>`);
}

function confirmReject(key){
  const dept=$('rej-dept').value;
  if(!dept){alert('Please select a department');return;}
  const fixAt=$('rej-fix').value;
  const cmt=$('rej-cmt').value;
  const insp=getCurrentInspector();
  const t=getTrailer(currentTrailerId);
  if(!t.checks)t.checks={};
  const prevCheck=t.checks[key]||{};
  const history=prevCheck.history||[];
  if(prevCheck.status==='rejected'){
    history.push({by:prevCheck.by,at:prevCheck.at,dept:prevCheck.dept});
  }
  t.checks[key]={
    ...prevCheck,
    status:'rejected',
    by:insp,
    at:now(),
    dept:dept,
    fixAt:fixAt||currentGate,
    rejectComment:cmt,
    history:history,
    lastAction:'rejected',
    lastBy:insp,
    lastAt:now()
  };
  t.approved=null;t.approvedAt=null;
  addHistory(t,'reject',key,prevCheck.status,'rejected',insp);
  save();closeModal();renderDetail();
}

function recheckItem(key,result){
  const insp=getCurrentInspector();
  if(!insp){alert('Please select an inspector for this gate first');return;}
  const t=getTrailer(currentTrailerId);
  const prev=t.checks[key];
  const history=prev.history||[];
  history.push({by:prev.by,at:prev.at,dept:prev.dept,result:'rejected'});
  t.checks[key]={
    ...prev,
    status:result==='pass'?'pass':'rejected',
    recheckBy:insp,
    recheckAt:now(),
    history:history,
    lastAction:'recheck-'+result,
    lastBy:insp,
    lastAt:now()
  };
  t.approved=null;t.approvedAt=null;
  addHistory(t,'recheck',key,'rejected',result,insp);
  save();renderDetail();
}

function showHoldDialog(key){
  const insp=getCurrentInspector();
  if(!insp){alert('Please select an inspector for this gate first');return;}
  if(!confirm('Escalate to '+HAKAN_NAME+' for decision?'))return;
  const t=getTrailer(currentTrailerId);
  if(!t.checks)t.checks={};
  const prev=(t.checks[key]||{}).status;
  t.checks[key]={
    ...t.checks[key],
    status:'hold',
    by:insp,
    at:now(),
    decision:null,
    lastAction:'hold-escalated',
    lastBy:insp,
    lastAt:now()
  };
  t.approved=null;t.approvedAt=null;
  addHistory(t,'hold',key,prev,'hold',insp);
  save();renderDetail();
}

function decideHold(key,decision){
  const t=getTrailer(currentTrailerId);
  const check=t.checks[key];

function startVoiceRecording(key){
  pendingPhoto={trailerId:currentTrailerId,key:key,type:'item',mediaType:'voice'};
  navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream=>{
      mediaRecorder=new MediaRecorder(stream);
      audioChunks=[];
      recordingSeconds=0;
      
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        const reader=new FileReader();
        reader.onload=ev=>showVoicePreview(ev.target.result);
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
        clearInterval(recordingTimer);
      };
      
      mediaRecorder.start();
      // Show recording UI overlay
      showModal(`<div style="text-align:center;padding:30px">
        <div style="font-size:48px;animation:pulse 1s infinite">🔴</div>
        <h2>Recording...</h2>
        <div id="rec-timer" style="font-family:monospace;font-size:24px;margin:10px 0">0:00</div>
        <button class="btn btn-danger" onclick="stopVoiceRecording()">⏹ Stop Recording</button>
      </div>`);
      
      recordingTimer=setInterval(()=>{
        recordingSeconds++;
        const el=document.getElementById('rec-timer');
        if(el)el.textContent=`${Math.floor(recordingSeconds/60)}:${(recordingSeconds%60).toString().padStart(2,'0')}`;
      },1000);
    })
    .catch(err=>alert('Microphone access denied'));
}

function stopVoiceRecording(){
  if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
}

function showVoicePreview(dataUrl){
  pendingPhotoDataUrl=dataUrl;
  showModal(`<div class="media-preview-modal">
    <h2>🎤 Voice Note Preview</h2>
    <audio src="${dataUrl}" controls style="width:100%;margin:12px 0"></audio>

}

function showReworkDashboard(){showView('rework');}

function renderReworkDashboard(){
  const el=$('rework-content');
  const byDept={};
  REJECT_DEPTS.forEach(d=>byDept[d]=[]);
  
  for(const t of trailers){
    for(const gid of GO){
      for(const it of G[gid].items){
        const check=(t.checks||{})[`${gid}|${it.num}`];
        if(check&&check.status==='rejected'){
          byDept[check.dept||'Other'].push({t,gid,it,check});
        }
      }
    }
  }
  
  let html='';
  for(const dept of REJECT_DEPTS){
    const items=byDept[dept];
    if(!items.length)continue;
    html+=`<div class="rework-section">
      <h3>${e(dept)} (${items.length})</h3>
      ${items.map(({t,gid,it,check})=>`<div class="rework-item">
        <div class="ri-header">${e(t.customer)} — ${e(t.model)} · ${e(t.inv)}</div>
        <div class="ri-desc">${GI[gid]} ${GN[gid]} · <strong>${it.num}</strong> — ${e(it.desc)}</div>
        <div class="ri-meta">🔴 Rejected by ${e(check.by)} · ${fmtShort(check.at)}${check.fixAt?` · Fix at: ${GN[check.fixAt]||check.fixAt}`:''}</div>
        <div class="ri-actions">
          <button class="btn btn-sm btn-green" onclick="reworkFromDash('${t.id}','${gid}|${it.num}','pass')">✅ Recheck Pass</button>
          <button class="btn btn-sm btn-danger" onclick="reworkFromDash('${t.id}','${gid}|${it.num}','rejected')">🔴 Re-reject</button>
          <button class="btn btn-sm btn-navy" onclick="openTrailer('${t.id}')">View Trailer</button>
        </div>
      </div>`).join('')}
    </div>`;
  }
  
  if(!html)html=`<div class="empty-state"><div class="icon">🔧</div><p>No open rework items!</p></div>`;
  el.innerHTML=html;
}

function reworkFromDash(trailerId,key,result){
  const insp=getCurrentInspector();
  if(!insp){alert('Please select an inspector first (go to trailer Quality Gates tab)');return;}
  const t=getTrailer(trailerId);
  const prev=t.checks[key];
  const history=prev.history||[];
  history.push({by:prev.by,at:prev.at,dept:prev.dept,result:'rejected'});
  t.checks[key]={
    ...prev,
    status:result==='pass'?'pass':'rejected',
    recheckBy:insp,
    recheckAt:now(),
    history:history,
    lastAction:'recheck-'+result,
    lastBy:insp,
    lastAt:now()
  };
  save();
  renderReworkDashboard();
}

function renderPunchList(){
  document.querySelectorAll('#punch-filters button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#punch-filters button')[punchFilter==='open'?0:punchFilter==='resolved'?1:2].classList.add('active');
  
  const items=[];
  for(const t of trailers){
    for(const gid of GO){
      for(const it of G[gid].items){
        const check=(t.checks||{})[`${gid}|${it.num}`];
        if(check&&check.status==='letgo'){
          const isResolved=check.resolved;
          if(punchFilter==='open'&&!isResolved)items.push({t,gid,it,check});
          if(punchFilter==='resolved'&&isResolved)items.push({t,gid,it,check});
          if(punchFilter==='all')items.push({t,gid,it,check});
        }
      }
    }
  }
  
  const el=$('punch-content');
  if(!items.length){el.innerHTML=`<div class="empty-state"><div class="icon">📋</div><p>No ${punchFilter} Let Go items</p></div>`;return;}
  
  el.innerHTML=items.map(({t,gid,it,check})=>`<div class="punch-item ${check.resolved?'resolved':''}">
    <div class="pi-header">${e(t.customer)} — ${e(t.model)} · ${e(t.inv)}</div>
    <span class="pi-reason">${e(check.letGoReason||'')}</span>
    <div class="pi-meta">${GI[gid]} ${GN[gid]} · ${it.num} — ${e(it.desc)}</div>

    ${check.resolved?`<div style="color:var(--green);font-size:12px">✅ Resolved by ${e(check.resolvedBy)} · ${fmtShort(check.resolvedAt)}</div>`:
    `<div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-sm btn-green" onclick="resolveFromPunch('${t.id}','${gid}|${it.num}')">✅ Resolve</button>

    </div>`}
  </div>`).join('');

function resolveFromPunch(trailerId,key){
  const note=prompt('Resolution notes:');
  if(note===null)return;
  const insp=getCurrentInspector();
  if(!insp){alert('Please select an inspector first (go to trailer Quality Gates tab)');return;}
  const t=getTrailer(trailerId);

  check.resolutionNote=note;
  check.lastAction='resolved';

  save();
  renderPunchList();
}

  let found=false;
  for(const gid of GO){
    const items=G[gid].items.filter(it=>getItemStatus(t,gid,it.num)===filterType);
    if(!items.length)continue;
    found=true;
    html+=`<div style="margin:10px 0"><strong style="color:var(--navy)">${GI[gid]} ${GN[gid]}</strong></div>`;
    html+=items.map(it=>`<div style="padding:8px;background:#f5f5f5;border-radius:8px;margin:4px 0;font-size:12px"><strong>${it.num}</strong> — ${e(it.desc)}</div>`).join('');
  }
  if(!found)html+=`<p style="color:#aaa">No ${filterType} items found</p>`;
  html+=`<button class="btn btn-gray btn-block" style="margin-top:14px" onclick="closeModal()">Close</button>`;
  showModal(html);
}

// ═════════════════════════════════════════════════════════════════════════════
// UTILITIES
// ═════════════════════════════════════════════════════════════════════════════
function showModal(content){
  $('mc').innerHTML=content;
  $('mo').classList.add('active');
}

function closeModal(){
  $('mo').classList.remove('active');
}

$('mo').onclick=ev=>{if(ev.target===$('mo'))closeModal();};

function exportData(){
  const data={trailers,exportedAt:now(),version:'v3'};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`escape-qg-v3-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Init
renderList();
</script>
